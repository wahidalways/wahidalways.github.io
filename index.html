    <!--
      Boot theme BEFORE first paint, so the first frame is already correct.

      Ground: the visitor's saved choice, else their OS preference.
      Signal: the saved accent preset, else "signal".

      ACCENTS below mirrors `accentThemes` in src/components/ThemeProvider.tsx
      — change both together. Values: fill, text-on-fill, text on paper,
      text on graphite.
    -->
    <script>
      (function () {
        var ACCENTS = {
          signal: ["12 96% 52%", "60 4% 7%", "12 85% 40%", "14 100% 62%"],
          cobalt: ["228 96% 60%", "0 0% 100%", "228 75% 48%", "226 100% 72%"],
          acid: ["74 88% 56%", "60 4% 7%", "80 75% 27%", "74 88% 60%"],
          jade: ["160 70% 42%", "60 4% 7%", "162 80% 26%", "158 62% 55%"],
          amber: ["36 100% 54%", "60 4% 7%", "30 90% 34%", "38 100% 60%"]
        };

        function read(key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        }

        var root = document.documentElement;
        var saved = read("theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = saved === "light" || saved === "dark" ? saved : prefersDark ? "dark" : "light";
        root.classList.add(theme);

        var a = ACCENTS[read("accentTheme")] || ACCENTS.signal;
        root.style.setProperty("--accent", a[0]);
        root.style.setProperty("--accent-foreground", a[1]);
        root.style.setProperty("--accent-text-light", a[2]);
        root.style.setProperty("--accent-text-dark", a[3]);
      })();
    </script>
