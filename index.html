    <!--
      Boot theme BEFORE first paint.

      Two things flash if this runs late: the light/dark class, and the ten
      colour presets, which ThemeProvider only applies in a mount effect while
      the stylesheet ships blue as its :root default. Both are resolved here,
      synchronously in <head>, so the first painted frame is already correct.

      The palette below is a mirror of `colorThemes` in
      src/components/ThemeProvider.tsx — change both together.
    -->
    <script>
      (function () {
        var PALETTE = {
          blue:    ["220 70% 50%", "175 80% 40%"],
          emerald: ["160 84% 39%", "142 71% 45%"],
          violet:  ["262 83% 58%", "280 65% 60%"],
          rose:    ["346 77% 50%", "340 82% 52%"],
          amber:   ["38 92% 50%",  "25 95% 53%"],
          ocean:   ["199 89% 48%", "187 92% 41%"],
          crimson: ["0 72% 51%",   "15 80% 55%"],
          slate:   ["215 20% 45%", "210 30% 55%"],
          forest:  ["150 60% 30%", "120 50% 40%"],
          sunset:  ["20 90% 55%",  "350 80% 55%"]
        };

        // Private-mode browsers throw on any localStorage access, so every read
        // is guarded and falls back to the same defaults ThemeProvider uses.
        function read(key, fallback) {
          try {
            return localStorage.getItem(key) || fallback;
          } catch (e) {
            return fallback;
          }
        }

        var root = document.documentElement;
        root.classList.add(read("theme", "dark") === "light" ? "light" : "dark");

        var pair = PALETTE[read("colorTheme", "crimson")] || PALETTE.crimson;
        root.style.setProperty("--primary", pair[0]);
        root.style.setProperty("--accent", pair[1]);
        root.style.setProperty("--ring", pair[0]);
        root.style.setProperty("--gradient-primary", "linear-gradient(135deg, hsl(" + pair[0] + "), hsl(" + pair[1] + "))");
        root.style.setProperty("--gradient-accent", "linear-gradient(135deg, hsl(" + pair[1] + "), hsl(" + pair[0] + "))");
      })();
    </script>
